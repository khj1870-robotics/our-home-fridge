<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="우리집 냉장고 - 냉장고 관리부터 끼니 해결까지">
  <rect width="960" height="240" rx="24" fill="#FFF3B8"/>
  <!-- 냉장고 -->
  <g transform="translate(96 36)" fill="none" stroke="#5B4636" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="0" y="0" width="112" height="168" rx="18" fill="#FFFFFF"/>
    <line x1="0" y1="62" x2="112" y2="62"/>
    <line x1="92" y1="22" x2="92" y2="44"/>
